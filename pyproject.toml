[project]
name = "ai-engineering-from-scratch"
version = "0.1.0"
requires-python = "==3.12.15"
dependencies = [
    "anyio>=4.4.0",
    "ipykernel>=7.0.0",
    "ipython>=8.25.0",
    "ipywidgets>=8.1.3",
    "jinja2>=3.1.4",
    "jupyter>=1.1.0",
    "jupyterlab>=4.2.4",
    "matplotlib>=3.9.1",
    "numpy>=2.0.1",
    "pandas>=2.2.2",
    "requests>=2.32.3",
    "scikit-learn>=1.5.1",
    "scipy>=1.14.0",
    "torch>=2.5.0",
    "torchaudio>=2.5.0",
    "torchvision>=0.20.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true